# Full stack for local development and QA. From a clean checkout:
#   1. copy .env.example to .env
#   2. docker compose up --build
#
# Entry points:
#   Frontend (SPA)  -> http://localhost:8080
#   Backend API     -> http://localhost:5083  (OpenAPI at /openapi/v1.json)
#   MailPit web UI  -> http://localhost:8025  (captures all outgoing email)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # Web UI. SMTP (1025) stays internal to the compose network.

  api:
    build:
      context: .
      dockerfile: src/HackathonTaskTicketingSystem.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      SMTP__Host: mailpit
      SMTP__Port: "1025"
    ports:
      - "5083:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
