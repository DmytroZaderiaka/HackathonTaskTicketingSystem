server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend. The trailing slash on proxy_pass
    # strips the "/api" prefix, so "/api/health" reaches the backend as "/health".
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths are served by the client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
